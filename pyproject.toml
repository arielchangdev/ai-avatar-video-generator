[project]
name = "ai-avatar-video-generator"
version = "1.0.0"
description = "本地零費用 AI 虛擬人物影片生成系統 (FastAPI + Celery + React)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Ensure the project root is importable so `from core ...`, `from models ...`
# resolve during collection regardless of the runner's working directory.
# `prepend` import mode (the classic default) puts rootdir on sys.path;
# pytest 9 switched the default to `importlib`, which broke these imports on CI.
pythonpath = ["."]
addopts = "--import-mode=prepend"
testpaths = ["tests"]
markers = [
    "property: Property-based tests using Hypothesis",
    "unit: Unit tests for individual components",
    "integration: Integration tests requiring GPU or external services",
]

[tool.hypothesis]
database_backend = "directory"
